# Production run, cloud variant of configs/benchmark.yaml.
# Differences from the §13 acceptance config, both recorded decisions:
#   - ladder capped at D=4: the D=6 rung needs ADR-007's v1.1 factored operand
#     (fat-MPS column tensors ~1 GB at L=16, chi=36) -- 1/D extrapolation runs
#     on rungs {2,3,4}. v1.1 has since landed (env: { factored: true }, ADR-015);
#     a D=6 ladder needs a new config + wall-clock budget, not just the flag.
#   - sdrg disabled: the D4 A/B measurement (docs/ab-report.md) showed Stage A
#     hurts in this weak-coupling localized regime (PT2 ledger bias).
run:      { name: bench-L16-D4, master_seed: 20260715, n_realizations: 32, workers: 8, out: runs/bench_L16_D4.zarr }
model:    { L: 16, delta_min: 1.0e-3, g_J: 1.0e-3, R_c: 3, polaron_kappa: 0.0,
            hartree: { enabled: false, K_max: 8, alpha: 0.5, tol: 1.0e-4 } }
sdrg:     { enabled: false, omega_stop: 0.3, f_max: 0.4, keep_first_order: true, tau_sdrg: 0.05 }
peps:     { ladder: [2, 3, 4], chi_factor: 1, dtype: complex128 }
env:      { eps_env: 1.0e-8, eps_env_E: 1.0e-6, polish: true, checkpoint_rows: true, retry_max: 3, dchi: auto }
kernels:  { backend: sketched, oversample: 8, power_iters: 1, eta: 1.0e-6, c_gate: 10.0, probes: 6,
            fallback_disable_rate: 0.20, eps_F: 1.0e-12 }
optimize: { su_steps: 0, inner_iters: 20, max_outer: 100, tol_E: 1.0e-8, tol_g_scale: 1.0e-6 }
invariants: { tau_chi: 1.0e-6, tau_tail: 0.02, allow_uncertified: false }
observables: { tier2: { enabled: false } }
