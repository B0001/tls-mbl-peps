[project]
name = "tlsmbl"
version = "0.0.1"
description = "Variational PEPS solver for TLS many-body localization with certified energy reporting"
authors = [{ name = "Benjamin James Hess", email = "hess.bn@gmail.com" }]
# Not an SPDX-listed license, so PEP 639 requires the LicenseRef- form.
# The Big Time License's "How to Request" clause looks for the licensor's address in
# "documentation, software package metadata, or an about screen" -- the author email
# above is that address, and it is repeated in LICENSE.md and README.md.
license = "LicenseRef-BigTimePublicLicense-2.0.0"
license-files = ["LICENSE.md"]
requires-python = ">=3.11,<3.15"
# Upper bound is torch's ABI ceiling, not a guess: torch 2.13.0 publishes cp310..cp314
# only, so 3.15 has no wheel at all. Bounding it here makes that fail at resolve time
# with a clear message instead of at `import torch`.
dependencies = ["numpy", "scipy", "zarr", "numcodecs", "pydantic>=2", "typer", "pyyaml"]

[project.optional-dependencies]
dev = ["pytest", "pytest-benchmark", "hypothesis", "ruff", "mypy", "quimb", "numpy<2.5"]
# quimb: independent cross-check oracle, allowed ONLY inside tests/golden/ (§4).
# numpy<2.5 is quimb's numba transitive constraint, dev-only.
# torch installed separately -- see CLAUDE.md (PyPI default wheel is CUDA-linked)
# jax optional, tier-2 prototype parity only: pip install jax

[project.scripts]
tlsmbl = "tlsmbl.cli:app"

[build-system]
# >=77 for PEP 639 `license` / `license-files` support.
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
# Anchors pytest's rootdir here. Without this, pytest walks up past the repo and can
# adopt an unrelated ancestor config/conftest (observed: a Downloads-level conftest.py
# that stubs out torch), silently breaking the suite.
testpaths = ["tests"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]
# prototypes/ is a frozen reference oracle (CLAUDE.md), not production code: compressed
# style is deliberate (E702 semicolons, E402 late imports, E741 `l`), and reformatting it
# risks perturbing numbers that golden tests pin. Audited before excluding -- the only
# alarming findings are two F821 `W` in bench_kernel.py, correct in principle (a `del W`
# at line 119 frees the n-by-n operand between D points) but benign, since `_time` calls
# the lambda before the del.
extend-exclude = ["prototypes"]

[tool.ruff.lint]
# Pinned explicitly rather than relying on ruff's default select. `ruff` floats in the
# dev extra, and its default rule set has grown across releases -- under 0.16.0 the
# previously-clean tree reports 30 findings, so "ruff clean" silently stopped being a
# reproducible statement. This is the set the codebase is actually validated against.
# Reviewed under 0.16.0's wider defaults: the extra findings are style (I001, UP037,
# RUF059, PLR0402, ISC004) or false positives -- B008 is the standard typer idiom, and
# the B023 hits in kernels/bench.py are lambdas consumed by `_median_time` within the
# same iteration, so late binding never manifests. Widening this set is a style choice,
# not a bug fix.
select = ["E4", "E7", "E9", "F"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src/tlsmbl"]

[[tool.mypy.overrides]]
module = ["torch", "torch.*", "yaml", "scipy.*", "zarr.*"]
ignore_missing_imports = true
