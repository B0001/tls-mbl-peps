# Production run, cloud variant of configs/benchmark.yaml.
# Differences from the §13 acceptance config, both recorded decisions:
#   - ladder capped at D=4, and STAYS capped: v1.1 factored compression landed
#     (env.factored, ADR-015) and removed the memory wall, but the measured
#     wall-clock wall is ~2 orders of magnitude away, so D=6 is not a config
#     change. Measured 2026-07-26 (L=8, factored, exact backend, 8 threads):
#     D=2 2.4 s, D=3 14.8 s, D=4 182 s per energy+gradient -> D-exponent 8.73,
#     extrapolating D=6 to ~1.7 h PER GRADIENT STEP at L=8 (L=16 is 4x the
#     sites). The §15 gate is < 4 h per realization; LBFGS needs O(1e2) steps.
#     Sketching does not rescue this: ADR-010's mandatory canonicalization is
#     Theta(chi^3 D^8), a factor D^2 ABOVE the Theta(chi^3 D^6) truncation the
#     sketch accelerates, so the kernel's 33x (docs/HANDOFF.md) is Amdahl-capped
#     to ~1.4x on the full row (measured D=6: 42.1 s -> 29.5 s). Also measured:
#     INV-3 fallback rate 25% at D=6 on a product-like state, above the 20%
#     auto-disable. D=6 needs P6 (Rust, ADR-008 scopes the WHOLE row loop --
#     correctly, since canonicalization not the SVD is the cost) or smaller L.
#     1/D extrapolation runs on rungs {2,3,4}.
#   - sdrg disabled: the D4 A/B measurement (docs/ab-report.md) showed Stage A
#     hurts in this weak-coupling localized regime (PT2 ledger bias).
run:      { name: bench-L16-D4, master_seed: 20260715, n_realizations: 32, workers: 8, out: runs/bench_L16_D4.zarr }
model:    { L: 16, delta_min: 1.0e-3, g_J: 1.0e-3, R_c: 3, polaron_kappa: 0.0,
            hartree: { enabled: false, K_max: 8, alpha: 0.5, tol: 1.0e-4 } }
sdrg:     { enabled: false, omega_stop: 0.3, f_max: 0.4, keep_first_order: true, tau_sdrg: 0.05 }
peps:     { ladder: [2, 3, 4], chi_factor: 1, dtype: complex128 }
env:      { eps_env: 1.0e-8, eps_env_E: 1.0e-6, polish: true, checkpoint_rows: true, retry_max: 3, dchi: auto }
kernels:  { backend: sketched, oversample: 8, power_iters: 1, eta: 1.0e-6, c_gate: 10.0, probes: 6,
            fallback_disable_rate: 0.20, eps_F: 1.0e-12 }
optimize: { su_steps: 0, inner_iters: 20, max_outer: 100, tol_E: 1.0e-8, tol_g_scale: 1.0e-6 }
invariants: { tau_chi: 1.0e-6, tau_tail: 0.02, allow_uncertified: false }
observables: { tier2: { enabled: false } }
